services:
  postgres:
    image: postgres:16
    container_name: life_manager_postgres
    restart: always
    environment:
      POSTGRES_DB: life_manager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/life_manager_db?schema=public
        JWT_SECRET: "${JWT_SECRET:-change-me}"
    container_name: life_manager_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/life_manager_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 3000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3000/api/v1}"
    container_name: life_manager_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
